sonar.organization=lusk
sonar.projectKey=lusky3_agentsync-tui
sonar.projectName=agentsync-tui

sonar.sources=.
# internal/testenv, internal/gitrepo/gittest and internal/runner/runnertest
# are test-helper packages: only _test.go files import them (no production
# package does), so they are analysed as test code, not as sources.
sonar.exclusions=**/*_test.go,**/testdata/**,test/**,docs/**,.superpowers/**,.claude/**,internal/testenv/**,internal/gitrepo/gittest/**,internal/runner/runnertest/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go,test/**,internal/testenv/**,internal/gitrepo/gittest/**,internal/runner/runnertest/**

sonar.go.coverage.reportPaths=coverage.out
sonar.coverage.exclusions=main.go,test/**

# godre:S8242 (context.Context stored in a struct) is declined on purpose.
# ui.App and every screen keep the program-lifetime root context (Deps.Ctx):
# a tea.Cmd is built inside Update, which has no context parameter, and every
# background read it starts must derive from that root so quitting cancels
# it. Threading the context through each screen's Update would only move
# the field into every call site, not remove it. Request-scoped work still
# takes ctx as a parameter (runner.Runner.Run, ui.Read). The ignore covers
# internal/ui only ("**" also matches zero directories, so internal/ui/app.go
# is included): a context field added anywhere else is still reported.
# Key syntax: SonarSource IssueExclusionProperties (sonar-core).
sonar.issue.ignore.multicriteria=ctxfield
sonar.issue.ignore.multicriteria.ctxfield.ruleKey=godre:S8242
sonar.issue.ignore.multicriteria.ctxfield.resourceKey=internal/ui/**/*.go
